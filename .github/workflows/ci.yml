name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Nightly run — catches environment drift (new Node releases, upstream
  # better-sqlite3/better-auth changes) even when the repo is quiet.
  schedule:
    - cron: '0 3 * * *'  # every day at 03:00 UTC
  workflow_dispatch: {}  # allow triggering the nightly run manually

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 compiles/downloads a Node-ABI-specific binary at install
      # time. Cache the compiled artifact so `npm ci` skips the rebuild. The key
      # must include the Node version — the binary is tied to the ABI.
      - name: Cache better-sqlite3 build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/better-sqlite3
          key: better-sqlite3-${{ runner.os }}-${{ runner.arch }}-node22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server (tsc --noEmit)
        working-directory: server
        run: npx tsc --noEmit

      - name: Run server integration tests
        working-directory: server
        run: npm test

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the client (vite build)
        run: npm run build -w client

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checks internal doc links (README.md + docs/) and the few external
      # links they point to (better-auth, resend). Fails CI on broken links.
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md docs/
