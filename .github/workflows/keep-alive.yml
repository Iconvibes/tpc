name: Keep Render awake

# Pings the Render web service so the free instance never idles out (Render
# spins a free service down after 15 minutes without inbound traffic, and the
# next visitor pays the ~1-minute cold start).
#
# Set the repository variable RENDER_SITE_URL to your site URL (Settings →
# Secrets and variables → Actions → Variables), e.g.
#   RENDER_SITE_URL=https://your-app.onrender.com
#
# Cost note: this is only free on PUBLIC repositories. On private repos each
# scheduled run bills a full Actions minute (~4,300+ min/month at this cadence),
# which blows straight past the 2,000 free minutes and then gets billed — use
# UptimeRobot or cron-job.org there instead.
#
# Two gotchas:
# - GitHub may delay scheduled runs by several minutes during busy periods.
#   If the site still spins down, tighten the cron to "*/5 * * * *" so the gap
#   never approaches Render's 15-minute window.
# - GitHub auto-disables scheduled workflows after 60 days with no repo
#   activity, so the schedule stops if this repo goes quiet.

on:
  schedule:
    # Every 10 minutes (UTC).
    - cron: '*/10 * * * *'
  # Lets you test it manually with the "Run workflow" button.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        env:
          SITE_URL: ${{ vars.RENDER_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::RENDER_SITE_URL repository variable is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Strip any trailing slash so the health path concatenates cleanly.
          SITE_URL="${SITE_URL%/}"
          # Ping /api/health rather than the root: the root HTML is served even
          # when the API is broken, so it would mask a broken build. The health
          # endpoint returns a tiny JSON body and still counts as inbound
          # traffic, so it keeps the service awake exactly the same way.
          # -f: fail on HTTP errors (a red run = free downtime alert);
          # -s hides progress, -S shows errors.
          # --max-time 120: Render's cold start can take ~1 minute to respond.
          curl -fsS --max-time 120 -o /dev/null -w "pinged %{http_code} in %{time_total}s\n" "$SITE_URL/api/health"
